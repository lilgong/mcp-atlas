name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - services/agent-environment
          - services/mcp_eval

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      run: uv sync --project "${{ matrix.project }}" --frozen

    - name: Run tests
      run: uv run --project "${{ matrix.project }}" --frozen pytest -q "${{ matrix.project }}/tests"
